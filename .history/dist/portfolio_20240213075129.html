<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link
      rel="icon"
      href="./images/programmer.jpg"
      type="image/x-icon"
      sizes="32x32"
    />
    

    <title>Portfolio</title>
  </head>
  <body>
    <nav
      x-data="{ isOpen: false}"
      class="relative bg-white dark:bg-gray-900 mb-8"
    >

        <div class="flex items-center justify-between">
          <a class="navbar-brand" href="index.html">
            <span class="fas fa-laptop text-3xl text-blue-500">Sodmaq</span>
          </a>

          <!-- Mobile menu button -->
          <div class="flex md:hidden">
            <button
              x-cloak
              @click="isOpen = !isOpen"
              type="button"
              class="text-gray-500 dark:text-gray-200 hover:text-gray-600 dark:hover:text-gray-400 focus:outline-none focus:text-gray-600 dark:focus:text-gray-400"
              aria-label="toggle menu"
            >
              <svg
                x-show="!isOpen"
                xmlns="http://www.w3.org/2000/svg"
                class="w-6 h-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M4 8h16M4 16h16"
                />
              </svg>

              <svg
                x-show="isOpen"
                xmlns="http://www.w3.org/2000/svg"
                class="w-6 h-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            </button>
          </div>
        </div>

        <!-- Mobile Menu open: "block", Menu closed: "hidden" -->
        <div
          x-cloak
          :class="[isOpen ? 'translate-x-0 opacity-100 ' : 'opacity-0 -translate-x-full']"
          class="absolute inset-x-0 z-20 w-full px-6 py-4 transition-all duration-300 ease-in-out bg-white dark:bg-gray-900 md:bg-transparent md:dark:bg-transparent md:mt-0 md:p-0 md:top-0 md:relative md:w-auto md:opacity-100 md:translate-x-0 md:flex md:items-center"
        >
          <div class="flex flex-col md:flex-row md:mx-6">
            <a
              class="my-2 text-gray-700 transition-colors duration-300 transform dark:text-gray-200 hover:text-blue-500 dark:hover:text-blue-400 md:mx-4 md:my-0"
              href="./index.html"
              >Home</a
            >
            <a
              class="my-2 text-gray-700 transition-colors duration-300 transform dark:text-gray-200 hover:text-blue-500 dark:hover:text-blue-400 md:mx-4 md:my-0"
              href="./portfolio.html"
              >Portfolio</a
            >
            <a
              class="my-2 text-gray-700 transition-colors duration-300 transform dark:text-gray-200 hover:text-blue-500 dark:hover:text-blue-400 md:mx-4 md:my-0"
              href="./contact.html"
              >Contact</a
            >
            <a
              class="my-2 text-gray-700 transition-colors duration-300 transform dark:text-gray-200 hover:text-blue-500 dark:hover:text-blue-400 md:mx-4 md:my-0"
              href="./about.html"
              >About</a
            >
          </div>
        </div>
      </div>
    </nav>
    <head>
      <style>
        body {
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
          margin: 20px;
          background-color: #f4f4f4;
        }

        .repo-container {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
          gap: 20px;
          justify-content: center;
        }

        .repo {
          padding: 15px;
          border: 1px solid #ddd;
          border-radius: 10px;
          background-color: #fff;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
          transition: transform 0.3s ease-in-out;
        }

        .repo:hover {
          transform: scale(1.05);
        }

        .repo h3 {
          margin: 0 0 10px;
          font-size: 1.2rem;
          color: #333;
        }

        .repo img {
          max-width: 100%;
          border-radius: 5px;
          margin-bottom: 10px;
        }

        .repo p {
          margin: 0;
          font-size: 1rem;
          color: #777;
        }

        .repo a {
          display: block;
          margin-top: 10px;
          text-decoration: none;
          color: #3498db;
          font-weight: bold;
          transition: color 0.3s ease-in-out;
        }

        .repo a:hover {
          color: #2980b9;
        }
      </style>
      <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    </head>
    <body>
      <div id="repositories" class="repo-container"></div>

      <script>
        document.addEventListener("DOMContentLoaded", function () {
          var apiUrl = "https://api.github.com/users/sodmaq/repos";

          axios
            .get(apiUrl)
            .then(function (response) {
              displayRepositories(response.data);
            })
            .catch(function (error) {
              console.error("Error fetching repositories:", error);
            });

          function displayRepositories(repos) {
            var repositoriesDiv = document.getElementById("repositories");

            if (repos.length === 0) {
              repositoriesDiv.innerHTML = "<p>No repositories found.</p>";
              return;
            }

            repos.forEach(function (repo) {
              var repoHtml = '<div class="repo">';
              repoHtml += '<img src="./images/com.png" alt="Owner Avatar">';
              repoHtml += "<h3>" + repo.name + "</h3>";
              repoHtml += "<h3>" + repo.language + "</h3>";
              repoHtml +=
                "<p>" +
                (repo.description || "No description available.") +
                "</p>";
              repoHtml +=
                '<a href="' +
                repo.html_url +
                '" target="_blank">View on GitHub</a>';

              repoHtml += "</div>";

              repositoriesDiv.innerHTML += repoHtml;
            });
          }
        });
      </script>
    </body>

    <footer class="bg-white rounded-lg shadow m-4 dark:bg-gray-800">

          Reserved.

        <ul

          <li>
            <a href="/dist/index.html" class="hover:underline me-4 md:me-6"
              >Home</a
            >
          </li>
          <li>
            <a href="/dist/portfolio.html" class="hover:underline me-4 md:me-6"
              >Portfolio</a
            >
          </li>
          <li>
            <a href="/dist/contact.html" class="hover:underline me-4 md:me-6"
              >Contact</a
            >
          </li>
          <li>
            <a href="/dist/about.html" class="hover:underline">About</a>

      </div>
    </footer>

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </body>
</html>
