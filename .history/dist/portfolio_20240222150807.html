      <style>
        body {
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
          margin: 20px;
          background-color: #f4f4f4;
        }

        .repo-container {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
          gap: 20px;
          justify-content: center;
        }

        .repo {
          padding: 15px;
          border: 1px solid #ddd;
          border-radius: 10px;
          background-color: #fff;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
          transition: transform 0.3s ease-in-out;
        }

        .repo:hover {
          transform: scale(1.05);
        }

        .repo h3 {
          margin: 0 0 10px;
          font-size: 1.2rem;
          color: #333;
        }

        .repo img {
          max-width: 100%;
          border-radius: 5px;
          margin-bottom: 10px;
        }

        .repo p {
          margin: 0;
          font-size: 1rem;
          color: #777;
        }

        .repo a {
          display: block;
          margin-top: 10px;
          text-decoration: none;
          color: #3498db;
          font-weight: bold;
          transition: color 0.3s ease-in-out;
        }

        .repo a:hover {
          color: #2980b9;
        }
      </style>
      <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    </head>
    <body>
      <div id="repositories" class="repo-container"></div>

      <script>
        document.addEventListener("DOMContentLoaded", function () {
          var apiUrl = "https://api.github.com/users/sodmaq/repos";

          axios
            .get(apiUrl)
            .then(function (response) {
              displayRepositories(response.data);
            })
            .catch(function (error) {
              console.error("Error fetching repositories:", error);
            });

          function displayRepositories(repos) {
            var repositoriesDiv = document.getElementById("repositories");

            if (repos.length === 0) {
              repositoriesDiv.innerHTML = "<p>No repositories found.</p>";
              return;
            }

            repos.forEach(function (repo) {
              var repoHtml = '<div class="repo">';
              repoHtml += '<img src="./images/com.png" alt="Owner Avatar">';
              repoHtml += "<h3>" + repo.name + "</h3>";
              repoHtml += "<h3>" + repo.language + "</h3>";
              repoHtml +=
                "<p>" +
                (repo.description || "No description available.") +
                "</p>";
              repoHtml +=
                '<a href="' +
                repo.html_url +
                '" target="_blank">View on GitHub</a>';

              repoHtml += "</div>";

              repositoriesDiv.innerHTML += repoHtml;
            });
          }
        });
      </script>
